[package]
name = "exchange-organelles"
version = "0.6.16"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"
ryu = "1"
regex = "1"
chrono = "0.4"
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"
