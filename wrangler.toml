# lucidota-exchange — LUCIDOTA Free Compute Exchange v0
name = "lucidota-exchange"
main = "worker.js"
compatibility_date = "2026-10-01"
account_id = "243aabef9144fd3b8dd334cb19319e75"

[[d1_databases]]
binding = "EXCHANGE_DB"
database_name = "exchange"
